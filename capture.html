<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NOX | Captura</title><style>body{font:16px system-ui;background:#111021;color:#fff;text-align:center;margin:0;padding:20px}button,input{font:inherit;padding:12px;border-radius:9px;border:1px solid #a18bff}button{background:#7954e8;color:white}input{width:min(90%,340px);background:#22213b;color:white}video{width:min(92vw,400px);border-radius:18px;transform:scaleX(-1);background:#333}#status{color:#9af3cb;white-space:pre-wrap}small{display:block;color:#b6b1c8;margin:10px}</style></head><body><h2>NOX • Captura facial</h2><p>Endereço do servidor WebSocket seguro (wss://)</p><input id="url" placeholder="wss://seu-servidor.example" autocapitalize="off" spellcheck="false"><p><button id="start">Iniciar câmera e rastreamento</button></p><p id="status">Aguardando início</p><video id="video" autoplay playsinline muted></video><small>A câmera é processada no próprio iPhone. Apenas números de expressões são enviados ao servidor configurado.</small><script type="module">import{FaceLandmarker,FilesetResolver}from 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/+esm';const $=id=>document.getElementById(id),status=$('status'),video=$('video');let ws,tracker,lastSent=0;const setStatus=s=>status.textContent=s;const val=(arr,name)=>arr?.find(x=>x.categoryName===name)?.score??0;function send(t){if(video.readyState<2)return;const r=tracker.detectForVideo(video,t);if(!r.faceBlendshapes?.length)return;const b=r.faceBlendshapes[0].categories;const roll=0;const data={type:'face',mouth:val(b,'jawOpen'),blinkL:val(b,'eyeBlinkLeft'),blinkR:val(b,'eyeBlinkRight'),smile:(val(b,'mouthSmileLeft')+val(b,'mouthSmileRight'))/2,roll};if(ws?.readyState===WebSocket.OPEN&&t-lastSent>45){ws.send(JSON.stringify(data));lastSent=t;}setStatus(`Rosto detectado ✓\nBoca: ${Math.round(data.mouth*100)}% | Piscadas: ${Math.round(data.blinkL*100)}% / ${Math.round(data.blinkR*100)}%\nServidor: ${ws?.readyState===1?'conectado':'não conectado'}`)}function frame(t){try{send(t)}catch(e){setStatus('Falha na detecção: '+e.message)}requestAnimationFrame(frame)}$('start').onclick=async()=>{try{$('start').disabled=true;setStatus('Preparando câmera…');const url=$('url').value.trim();if(!/^wss:\/\//i.test(url))throw Error('Informe um endereço wss:// válido.');ws=new WebSocket(url);ws.onclose=()=>setStatus('Conexão encerrada. Confira o servidor e recarregue.');ws.onerror=()=>setStatus('Erro de conexão WebSocket.');const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:640},height:{ideal:480}},audio:false});video.srcObject=stream;await video.play();setStatus('Carregando rastreador…');const vision=await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/wasm');tracker=await FaceLandmarker.createFromOptions(vision,{baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task',delegate:'CPU'},runningMode:'VIDEO',numFaces:1,outputFaceBlendshapes:true});requestAnimationFrame(frame)}catch(e){setStatus('Erro: '+e.message);$('start').disabled=false}};</script></body></html>
