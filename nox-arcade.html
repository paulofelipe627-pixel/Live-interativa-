
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">

<title>NOX Arcade V2</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #080a16;
  color: white;
  font-family: Arial, sans-serif;
}

.stage {
  width: 100vw;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  padding: env(safe-area-inset-top) 4px env(safe-area-inset-bottom);
  gap: 5px;
}

/* PERSONAGEM NOX */
.avatar {
  height: 22%;
  flex-shrink: 0;
  position: relative;
  overflow: hidden;
  border: 1px solid #7844db;
  border-radius: 10px;
  background: #151025;
}

.avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center 43%;
  animation: idle 4s ease-in-out infinite;
}

.brand {
  position: absolute;
  top: 10px;
  right: 12px;
  font-size: 22px;
  font-weight: bold;
  text-shadow: 0 0 12px #9333ea;
}

.brand small {
  display: block;
  font-size: 10px;
  color: #d6c5ff;
}

/* JOGO LIVECADE */
.game {
  height: 45%;
  flex-shrink: 0;
  position: relative;
  overflow: hidden;
  border: 1px solid #3458b5;
  border-radius: 10px;
  background: #101b35;
}

.game iframe {
  width: 100%;
  height: 100%;
  border: none;
  display: block;
}

/* ESPAÇO PARA CHAT DO TIKTOK */
.chat-space {
  flex: 1;
  min-height: 0;
  position: relative;
  background: #080a16;
}

/* ANIMAÇÕES */
@keyframes idle {
  0%, 100% {
    transform: scale(1.02) translateY(0);
  }
  50% {
    transform: scale(1.04) translateY(-2px);
  }
}

.avatar.talk img {
  animation: talk 0.25s infinite alternate;
}

@keyframes talk {
  from {
    transform: scale(1.02);
  }
  to {
    transform: scale(1.06) translateY(-2px);
  }
}

.avatar.celebrate img {
  animation: celebrate 0.4s infinite alternate;
}

@keyframes celebrate {
  from {
    transform: scale(1.03) rotate(-1deg);
  }
  to {
    transform: scale(1.07) rotate(1deg);
  }
}
</style>
</head>

<body>

<main class="stage">

  <!-- PERSONAGEM NOX -->
  <section id="avatar" class="avatar">
    <img src="assets/nox-preview.webp" alt="NOX">

    <div class="brand">
      NOX
      <small>ARCADE • V2</small>
    </div>
  </section>

  <!-- JOGO LIVECADE -->
  <section class="game">
    <iframe
      src="https://overlay.livecade.io/EPMcQ26hOojfdtqIBHm6UOXLoLHDC6oj"
      title="Livecade"
      allow="autoplay; fullscreen"
      allowfullscreen>
    </iframe>
  </section>

  <!-- ÁREA LIVRE PARA O CHAT NATIVO -->
  <section class="chat-space"></section>

</main>

<script>
const avatar = document.getElementById("avatar");
let timer;

function react(mode) {
  clearTimeout(timer);

  avatar.classList.remove("talk", "celebrate");

  if (mode === "talk" || mode === "celebrate") {
    avatar.classList.add(mode);

    timer = setTimeout(() => {
      avatar.classList.remove("talk", "celebrate");
    }, 3500);
  }
}
</script>

</body>
</html>
