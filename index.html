
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
    content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

  <title>Contexto - Live Interativa</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #080b12;
    }

    .game {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #080b12;
    }

    .game iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: none;
      background: #080b12;
    }
  </style>
</head>

<body>
  <div class="game">
    <iframe
      src="https://overlay.livecade.io/EPMcQ26hOojfdtqIBHm6UOXLoLHDC6oj"
      allow="autoplay">
    </iframe>
  </div>
</body>
</html>
