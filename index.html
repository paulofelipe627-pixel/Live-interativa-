<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1,
maximum-scale=1,
user-scalable=no,
viewport-fit=cover">

<title>Live Interativa</title>

<style>

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #05070c;
  font-family: Arial, Helvetica, sans-serif;
}

.live {
  position: fixed;
  inset: 0;
  width: 100vw;
  height: 100vh;
  overflow: hidden;
  background: #05070c;
}


/* TOPO AZUL */

.top {
  position: absolute;
  top: 0;
  left: 0;

  width: 100%;
  height: 8%;

  z-index: 20;

  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;

  text-align: center;
  color: white;

  background-image:
    linear-gradient(
      rgba(0,0,0,.30),
      rgba(0,0,0,.55)
    ),
    "url("./top-blue.png?v=2");

  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;

  border-bottom:
    1px solid rgba(255,255,255,.18);
}

.title {
  font-size: clamp(18px, 5vw, 29px);
  font-weight: 900;
  letter-spacing: .3px;
  line-height: 1;
}

.gift {
  margin-top: 6px;

  font-size: clamp(11px, 3.2vw, 17px);
  font-weight: 900;

  color: #ffd84d;

  text-shadow:
    0 2px 5px rgba(0,0,0,.9);
}


/* JOGO */

.game {
  position: absolute;

  top: 8%;
  left: 0;

  width: 100%;
  height: 84%;

  z-index: 1;

  overflow: hidden;

  background: black;
}

.game iframe {
  width: 100%;
  height: 100%;

  display: block;

  border: 0;

  background: black;
}


/* RODAPÉ VERMELHO */

.bottom {
  position: absolute;

  bottom: 0;
  left: 0;

  width: 100%;
  height: 8%;

  z-index: 20;

  display: flex;
  justify-content: center;
  align-items: center;

  padding: 0 15px;

  text-align: center;

  color: white;

  background-image:
    linear-gradient(
      rgba(0,0,0,.30),
      rgba(0,0,0,.55)
    ),
    url("./bottom-red.png?v=2");

  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;

  border-top:
    1px solid rgba(255,255,255,.18);
}

.comment {
  font-size: clamp(14px, 3.8vw, 21px);
  font-weight: 900;

  text-shadow:
    0 2px 5px rgba(0,0,0,.9);
}


/* ANIMAÇÃO LEVE */

@keyframes attention {

  0%, 100% {
    transform: scale(1);
  }

  50% {
    transform: scale(1.025);
  }

}

.gift {
  animation:
    attention 2.5s ease-in-out infinite;
}

</style>
</head>


<body>

<div class="live">

  <!-- TOPO AZUL -->

  <div class="top">

    <div class="title">
      ⚔️ VOCÊ CONTROLA A BATALHA
    </div>

    <div class="gift">
      🎁 PRESENTE = AÇÃO NO JOGO
    </div>

  </div>


  <!-- JOGO -->

  <div class="game">

    <iframe
      src="https://overlay.livecade.io/EPMcQ26hOojfdtqIBHm6UOXLoLHDC6oj"
    </iframe>

  </div>


  <!-- RODAPÉ VERMELHO -->

  <div class="bottom">

    <div class="comment">
      💬 COMENTE = A LIVE RESPONDE 🔊
    </div>

  </div>

</div>

</body>

</html>
