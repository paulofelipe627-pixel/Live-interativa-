<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
    }

    .legenda {
      position: fixed;
      left: 5%;
      width: 90%;
      text-align: center;
      font-family: Arial, sans-serif;
      font-size: clamp(20px, 5vw, 48px);
      font-weight: 900;
      color: #fff;
      text-shadow:
        -2px -2px 0 #000,
         2px -2px 0 #000,
        -2px  2px 0 #000,
         2px  2px 0 #000;
    }

    .superior { top: 12%; }
    .inferior { bottom: 18%; }
  </style>
</head>
<body>
  <div class="legenda superior">VOCÊ CONTROLA A LIVE!</div>
  <div class="legenda inferior">COMENTE, A LIVE RESPONDE!</div>
</body>
</html>
