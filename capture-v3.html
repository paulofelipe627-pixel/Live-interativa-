<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NOX | Captura facial V2</title>
<style>
body{font:16px system-ui;background:#111021;color:#fff;text-align:center;margin:0;padding:20px}
button,input{font:inherit;padding:12px;border-radius:9px;border:1px solid #a18bff}
button{background:#7954e8;color:white;cursor:pointer}button:disabled{opacity:.55}
input{width:min(90%,340px);background:#22213b;color:white;box-sizing:border-box}
video{width:min(92vw,400px);border-radius:18px;transform:scaleX(-1);background:#333;min-height:150px}
#status{color:#9af3cb;white-space:pre-wrap;line-height:1.5}small{display:block;color:#b6b1c8;margin:10px}
</style>
</head>
<body>
<h2>NOX • Captura facial V2</h2>
<p>Servidor WebSocket seguro (wss://)</p>
<input id="url" placeholder="wss://seu-tunel.trycloudflare.com" autocapitalize="off" autocomplete="off" spellcheck="false">
<p><button id="start">Iniciar câmera</button></p>
<p id="status">Aguardando início</p>
<video id="video" autoplay playsinline muted></video>
<small>O vídeo permanece no iPhone. Somente números de expressões são enviados ao servidor.</small>
<script>
const $=id=>document.getElementById(id);
const statusEl=$('status'), video=$('video'), start=$('start');
let ws=null, tracker=null, lastSent=0, running=false, cameraStream=null;
function status(s){statusEl.textContent=s;}
function val(arr,name){return arr?.find(x=>x.categoryName===name)?.score??0;}
function connectWebSocket(address){
  if(!address){status('Câmera funcionando. Servidor não informado: teste local.');return;}
  if(!/^wss:\/\//i.test(address)){status('Câmera funcionando. Endereço inválido: use wss://');return;}
  try{
    ws=new WebSocket(address);
    ws.onopen=()=>status('Servidor conectado. Preparando rastreamento…');
    ws.onerror=()=>console.warn('Falha na conexão WebSocket');
    ws.onclose=()=>console.warn('WebSocket desconectado');
  }catch(e){console.warn('WebSocket:',e.message);}
}
async function withTimeout(promise,ms,label){
  let timer;
  try{return await Promise.race([promise,new Promise((_,reject)=>{timer=setTimeout(()=>reject(new Error(label+' demorou mais de '+Math.round(ms/1000)+' segundos')),ms);})]);}
  finally{clearTimeout(timer);}
}
function frame(){
  if(!running)return;
  try{
    if(tracker&&video.readyState>=2){
      const t=performance.now();
      const r=tracker.detectForVideo(video,t);
      if(r.faceBlendshapes?.length){
        const b=r.faceBlendshapes[0].categories;
        const data={type:'face',mouth:val(b,'jawOpen'),blinkL:val(b,'eyeBlinkLeft'),blinkR:val(b,'eyeBlinkRight'),smile:(val(b,'mouthSmileLeft')+val(b,'mouthSmileRight'))/2,roll:0};
        if(ws?.readyState===WebSocket.OPEN&&t-lastSent>45){ws.send(JSON.stringify(data));lastSent=t;}
        if(t-lastStatus>350){status('Rosto detectado ✓\nBoca: '+Math.round(data.mouth*100)+'% | Piscadas: '+Math.round(data.blinkL*100)+'% / '+Math.round(data.blinkR*100)+'%\nServidor: '+(ws?.readyState===1?'conectado':'desconectado'));lastStatus=t;}
      }else if(t-lastStatus>700){status('Câmera ativa. Posicione seu rosto diante do iPhone.\nServidor: '+(ws?.readyState===1?'conectado':'desconectado'));lastStatus=t;}
    }
  }catch(e){running=false;status('Erro durante rastreamento: '+e.message);start.disabled=false;return;}
  requestAnimationFrame(frame);
}
let lastStatus=0;
start.addEventListener('click',async()=>{
  start.disabled=true;
  try{
    status('1/3 Solicitando acesso à câmera…');
    if(!navigator.mediaDevices?.getUserMedia)throw new Error('Este navegador não disponibiliza getUserMedia. Abra em HTTPS no Safari.');
    cameraStream=await withTimeout(navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:640},height:{ideal:480}},audio:false}),15000,'A câmera');
    video.srcObject=cameraStream;
    await withTimeout(video.play(),10000,'A reprodução do vídeo');
    status('2/3 Câmera ativa ✓\nConectando servidor e carregando rastreador…');
    connectWebSocket($('url').value.trim());
    // Importação dinâmica: uma falha no CDN não impede a câmera de iniciar.
    const {FaceLandmarker,FilesetResolver}=await withTimeout(import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/+esm'),20000,'A biblioteca MediaPipe');
    status('3/3 Biblioteca carregada ✓\nPreparando modelo facial…');
    const vision=await withTimeout(FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/wasm'),20000,'O módulo WASM');
    tracker=await withTimeout(FaceLandmarker.createFromOptions(vision,{baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task',delegate:'CPU'},runningMode:'VIDEO',numFaces:1,outputFaceBlendshapes:true}),35000,'O modelo facial');
    status('Rastreador pronto ✓\nOlhe para a câmera.');
    running=true;requestAnimationFrame(frame);
  }catch(e){status('Erro: '+e.message+'\nSe a imagem da câmera apareceu, a permissão funcionou e o problema está na etapa seguinte.');start.disabled=false;}
});
</script>
</body></html>
